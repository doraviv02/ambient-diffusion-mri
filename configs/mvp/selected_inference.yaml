prior_delta_prob: 5
prior_acs_lines: 20
checkpoints:
  original: /home/doraviv/Lowfield_Ambient/models/ambient_diffusion_mri/ambient_models/ambient/R=4
  finetuned: /home/doraviv/Lowfield_Ambient/runs/mv_ambient_mvp/checkpoints/crossview_t2/best
# The redundant "joint likelihood, original prior" methods (old M4/M8/M10/M14/M17)
# were removed: joint == analytic merge for aligned identical-mask views. Each family
# keeps one merge representative plus the cross-view fine-tuned method (the contribution).
methods:
  single_r4:
    checkpoint: original
    condition: single_r4
  fixed_split_merge:
    checkpoint: original
    condition: merge_fixed
  fixed_split_ft:
    checkpoint: finetuned
    condition: joint_fixed
  dup2_ft:
    checkpoint: finetuned
    condition: joint_extra
  dup2_merge:
    checkpoint: original
    condition: merge_extra
  dup4_ft:
    checkpoint: finetuned
    condition: joint_quad
  dup4_merge:
    checkpoint: original
    condition: merge_quad
  full_diffusion:
    checkpoint: original
    condition: single_full
  comp2_ft:
    checkpoint: finetuned
    condition: joint_extra_comp
  comp2_merge:
    checkpoint: original
    condition: merge_extra_comp
  comp4_ft:
    checkpoint: finetuned
    condition: joint_quad_comp
  comp4_merge:
    checkpoint: original
    condition: merge_quad_comp
  # fully-complementary (split ACS, no overlap): coverage == lines bought
  fcomp2_ft:
    checkpoint: finetuned
    condition: joint_extra_fullcomp
  fcomp2_merge:
    checkpoint: original
    condition: merge_extra_fullcomp
  fcomp4_ft:
    checkpoint: finetuned
    condition: joint_quad_fullcomp
  fcomp4_merge:
    checkpoint: original
    condition: merge_quad_fullcomp
